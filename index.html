<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siesta Sail — Выбор раздела</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a1a2f;
            --bg-2: #12365c;
            --fg: #f4f0e8;
            --muted: rgba(244, 240, 232, 0.7);
            --card: rgba(244, 240, 232, 0.06);
            --card-border: rgba(244, 240, 232, 0.16);
            --accent: #e9c46a;
        }

        html, body { height: 100%; }

        body {
            font-family: 'Hanken Grotesk', system-ui, sans-serif;
            color: var(--fg);
            background: radial-gradient(120% 120% at 50% 0%, var(--bg-2) 0%, var(--bg) 60%);
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6vh 24px;
            text-align: center;
            gap: 48px;
        }

        .hero { max-width: 640px; }

        .eyebrow {
            font-size: 0.8rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: clamp(2.4rem, 6vw, 4rem);
            line-height: 1.05;
            letter-spacing: -0.01em;
        }

        h1 em { font-style: italic; font-weight: 400; color: var(--accent); }

        .subtitle {
            margin-top: 18px;
            font-size: clamp(1rem, 2.4vw, 1.15rem);
            color: var(--muted);
            line-height: 1.6;
        }

        .choices {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 260px));
            gap: 22px;
        }

        @media (max-width: 560px) {
            .choices { grid-template-columns: 1fr; width: 100%; max-width: 340px; }
        }

        .choice {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 40px 28px;
            border-radius: 20px;
            background: var(--card);
            border: 1px solid var(--card-border);
            color: var(--fg);
            text-decoration: none;
            transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
            backdrop-filter: blur(6px);
        }

        .choice:hover,
        .choice:focus-visible {
            transform: translateY(-6px);
            background: rgba(244, 240, 232, 0.12);
            border-color: var(--accent);
            outline: none;
        }

        .choice .icon { font-size: 2.6rem; line-height: 1; }

        .choice .label {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .choice .hint {
            font-size: 0.9rem;
            color: var(--muted);
        }

        footer {
            font-size: 0.8rem;
            color: var(--muted);
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body>
    <section class="hero">
        <p class="eyebrow">Siesta Sail</p>
        <h1>Куда <em>отправимся</em>?</h1>
        <p class="subtitle">Выберите раздел — расскажем о путешествиях под парусом или построим маршрут на интерактивной карте.</p>
    </section>

    <nav class="choices">
        <a class="choice" href="./site/">
            <span class="icon">⛵</span>
            <span class="label">Сайт</span>
            <span class="hint">О программах, маршрутах и капитанах</span>
        </a>
        <a class="choice" href="./map/">
            <span class="icon">🗺️</span>
            <span class="label">Карта</span>
            <span class="hint">Конструктор маршрутов путешествий</span>
        </a>
    </nav>

    <footer>© Siesta Sail</footer>
</body>
</html>
